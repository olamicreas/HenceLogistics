name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm install

      - name: Install EAS CLI Globally
        run: npm install -g eas-cli

      - name: Run Expo Prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Build iOS Locally on Free Cloud Mac
        run: EAS_NO_VCS=1 RCT_USE_PREBUILT_RNCORE=0 eas build --platform ios --local --non-interactive
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_ID: "info@hencedelivery.com"

      - name: Submit to App Store Connect
        run: npx eas submit --platform ios --non-interactive --auto-submit
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_ID: "info@hencedelivery.com"

      - name: Save the .ipa File
        uses: actions/upload-artifact@v4
        with:
          name: HenceLogistics-iOS
          path: '*.ipa'
