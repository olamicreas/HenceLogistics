name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Node"
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: "Force Xcode 16.1 System-Wide"
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'

      - name: "Install Project Dependencies"
        run: |
          npm install
          npx expo install react-native-webview

      - name: "Install EAS CLI Globally"
        run: npm install -g eas-cli

      - name: "Configure Native iOS Project & Fix Node Path"
        run: |
          defaults write com.apple.dt.Xcode IDEBuildOperationMaxNumberOfConcurrentCompileTasks 2
          defaults write com.apple.dt.Xcode PBXNumberOfParallelBuildSubtasks 2
          
          npx expo prebuild --platform ios --clean
          echo "export NODE_BINARY=\"$(which node)\"" > ios/.xcode.env.local
          
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: "Build iOS Locally on Free Cloud Mac"
        run: EXPO_DEBUG=1 EAS_NO_VCS=1 eas build --platform ios --local --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_ID: "info@hencedelivery.com"

      - name: "Submit to App Store Connect"
        run: npx eas submit --platform ios --non-interactive --auto-submit
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_ID: "info@hencedelivery.com"

      - name: "Save the .ipa File"
        uses: actions/upload-artifact@v4
        with:
          name: HenceLogistics-iOS
          path: '*.ipa'
