name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "Setup Node"
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: "Force Xcode 16.1 System-Wide"
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'

      - name: "Configure Xcode & Fix Build Environment"
        run: |
          defaults write com.apple.dt.Xcode IDESkipPackagePluginValidation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroValidation -bool YES
          defaults write com.apple.dt.Xcode IDEBuildOperationMaxNumberOfConcurrentCompileTasks 2
          defaults write com.apple.dt.Xcode PBXNumberOfParallelBuildSubtasks 2
          defaults write com.apple.dt.Xcode IDEPackageResolutionUseSystemGit -bool YES
          
          sudo mkdir -p /usr/local/bin
          sudo ln -sf $(which node) /usr/local/bin/node
          sudo ln -sf $(which npm) /usr/local/bin/npm
          sudo ln -sf $(which npx) /usr/local/bin/npx
          
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          echo "machine github.com login x-access-token password ${{ secrets.GITHUB_TOKEN }}" > ~/.netrc
          chmod 600 ~/.netrc
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: "Install Project Dependencies"
        run: npm install

      - name: "Install EAS CLI Globally"
        run: npm install -g eas-cli

      - name: "Build iOS Locally on Free Cloud Mac"
        run: EAS_NO_VCS=1 eas build --platform ios --local --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_ID: "info@hencedelivery.com"

      - name: "Submit to App Store Connect"
        run: npx eas submit --platform ios --non-interactive --auto-submit
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_ID: "info@hencedelivery.com"

      - name: "Save the .ipa File"
        uses: actions/upload-artifact@v4
        with:
          name: HenceLogistics-iOS
          path: '*.ipa'
