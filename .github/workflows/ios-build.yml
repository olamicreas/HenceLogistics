name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Node"
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: "Force Xcode 16.1 System-Wide"
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'

      - name: "Fix Apple SPM & Xcode Sandboxing"
        run: |
          # 1. DELETE .GIT FOLDER (The real SPM fix)
          # This prevents GitHub Actions' scoped tokens from leaking into Swift Package Manager
          # and breaking public downloads like Stripe.
          rm -rf .git

          # 2. Kill Xcode 16 Sandboxing so Expo scripts can execute
          defaults write com.apple.dt.Xcode IDEEnableUserScriptSandboxing -bool NO
          defaults write com.apple.dt.Xcode IDESkipPackagePluginValidation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroValidation -bool YES
          
          # 3. Prevent Memory Crashes
          defaults write com.apple.dt.Xcode IDEBuildOperationMaxNumberOfConcurrentCompileTasks 2
          defaults write com.apple.dt.Xcode PBXNumberOfParallelBuildSubtasks 2
          
          # 4. Link Node globally just in case Expo needs it in a subshell
          sudo mkdir -p /usr/local/bin
          sudo ln -sf $(which node) /usr/local/bin/node

      - name: "Install Project Dependencies"
        run: npm install

      - name: "Install EAS CLI Globally"
        run: npm install -g eas-cli

      - name: "Build iOS Locally on Free Cloud Mac"
        run: ENABLE_USER_SCRIPT_SANDBOXING=NO EAS_NO_VCS=1 eas build --platform ios --local --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_ID: "info@hencedelivery.com"

      - name: "Submit to App Store Connect"
        run: npx eas submit --platform ios --non-interactive --auto-submit
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_ID: "info@hencedelivery.com"

      - name: "Save the .ipa File"
        uses: actions/upload-artifact@v4
        with:
          name: HenceLogistics-iOS
          path: '*.ipa'
