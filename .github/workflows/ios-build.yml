name: Build iOS App

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Node"
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: "Force Xcode 16.1 System-Wide"
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'

      - name: "Install Project Dependencies"
        run: |
          npm install
          npx expo install react-native-webview
          npm install -g eas-cli

      - name: "Configure Sandbox Environment & Bypasses"
        run: |
          # 1. Prevent SPM Rate Limiting by Apple/GitHub
          rm -rf .git
          
          # 2. Inject Sandbox Variables into eas.json
          node -e "
          const fs = require('fs');
          const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          eas.build = eas.build || {};
          eas.build.production = eas.build.production || {};
          eas.build.production.env = eas.build.production.env || {};
          
          // Force everything to build from source (Bypasses ExpoModulesJSI recursive script crash)
          eas.build.production.env.EXPO_USE_PRECOMPILED_MODULES = '0';
          eas.build.production.env.RCT_USE_PREBUILT_RNCORE = '0';
          eas.build.production.env.EXPO_USE_SPM = '0';
          eas.build.production.env.ENABLE_USER_SCRIPT_SANDBOXING = 'NO';
          
          // Give Xcode the exact absolute path to Node.js
          eas.build.production.env.NODE_BINARY = process.execPath;
          eas.build.production.env.EXPO_DEBUG = '1';
          
          fs.writeFileSync('eas.json', JSON.stringify(eas, null, 2));
          console.log('Successfully injected build-from-source flags into eas.json');
          "

      - name: "Build iOS Locally on Free Cloud Mac"
        run: EAS_NO_VCS=1 eas build --platform ios --local --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_ID: "info@hencedelivery.com"
          EXPO_USE_PRECOMPILED_MODULES: "0"
          RCT_USE_PREBUILT_RNCORE: "0"
          EXPO_USE_SPM: "0"

      - name: "Submit to App Store Connect"
        run: npx eas submit --platform ios --non-interactive --auto-submit
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_ID: "info@hencedelivery.com"

      - name: "Save the .ipa File"
        uses: actions/upload-artifact@v4
        with:
          name: HenceLogistics-iOS
          path: '*.ipa'
